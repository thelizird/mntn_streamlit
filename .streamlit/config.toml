[server]
# Enable external access for GitHub Codespaces
headless = true
address = "0.0.0.0"
port = 8501

# Disable file watcher for better performance in cloud environments
runOnSave = false

# CORS settings for Codespaces
enableCORS = false
enableXsrfProtection = false

[browser]
# Don't automatically open browser in Codespaces
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8501

[theme]
# Professional theme settings
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"
